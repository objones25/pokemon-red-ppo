[project]
name = "pokered-ppo"
version = "0.1.0"
description = "PPO agent for Pokemon Red on PyBoy, rewarding exploration and story progress without farmable terms."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "pyboy==2.9.0",
    "numpy",
    # On Linux, torch comes from the pod image through the venv's system site-packages: runpod/pytorch:1.6.0-cu1300-torch2130-ubuntu2404.
    # Never install a second copy there. The Mac uses the same version so that tests run against what the pod runs.
    "torch==2.13.0 ; sys_platform == 'darwin'",
    "gymnasium>=1.4.0",
    "wandb>=0.31.0",
    "tyro>=1.0.16",
    "httpx>=0.28.1",
]

[project.scripts]
pokered-train = "pokered.train:main"
pokered-evaluate = "pokered.evaluate:main"
pokered-delete-pod = "pokered.runpod:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist",
    "hypothesis",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokered"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
strict = true
addopts = [
    "--import-mode=importlib",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--cov",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
    "-m", "not slow",
]
markers = [
    "slow: takes more than ~1s; deselected by default",
]
filterwarnings = [
    "error",
    # PyBoy's pysdl2-dll dependency announces its binaries on import, even for window="null".
    "ignore:Using SDL2 binaries from pysdl2-dll:UserWarning",
]
faulthandler_timeout = 120
# tests/support.py
pythonpath = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "class .*\\bProtocol\\):", "\\.\\.\\."]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["mutants", "docs/evidence"]

[tool.ruff.lint]
select = ["PT", "B", "S", "SIM", "RUF", "E", "F", "I", "UP", "ARG", "DTZ", "PGH004"]
ignore = ["PT001", "PT023", "E501"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"
raises-require-match-for = ["BaseException", "Exception", "ValueError", "OSError", "IOError", "socket.error"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S311", "ARG001", "ARG002", "SIM105"]
"**/conftest.py" = ["S101", "S311", "ARG001"]
"**/scripts/*.py" = ["S603", "S607"]
"tests/test_shell_scripts.py" = ["S101", "ARG001", "S603"]
"src/pokered/ram_map.py" = ["S324", "RUF005", "UP037"]
"src/pokered/negative_space.py" = ["UP046", "UP047"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["scripts/audit_tests.py", "scripts/audit_negative_space.py"]
typeCheckingMode = "standard"
